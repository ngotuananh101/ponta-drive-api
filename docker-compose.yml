services:
  api:
    # Built from ./Dockerfile so the image ships a CA bundle (ca-certificates).
    # debian:stable-slim on its own has no CA bundle, so every HTTPS call to
    # cloud storage failed with "x509: certificate signed by unknown authority".
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./:/app
    working_dir: /app
    network_mode: "host"
    restart: unless-stopped
    entrypoint: /app/main
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '/app/main' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
